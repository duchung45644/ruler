<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent</title>
<style>
  :root { --bg:#0b0d12; --panel:#11141b; --line:#1f2430; --fg:#e6e8ee; --muted:#8b93a7; --accent:#5eead4; --user:#1e2533; }
  * { box-sizing: border-box }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.55 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing:antialiased }
  body { display:flex; flex-direction:column }
  header { display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line) }
  header b { font-weight:600; letter-spacing:-.2px }
  .pill { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:4px 10px }
  .pill i { width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 0 3px #34d39933 }
  .logo { width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg,#a78bfa,#6366f1) }
  #log { flex:1; overflow:hidden; padding:22px 20px; display:flex; flex-direction:column; gap:14px; justify-content:flex-end }
  .msg { max-width:88%; animation:in .25s ease-out both }
  .user { align-self:flex-end; background:var(--user); border-radius:14px 14px 4px 14px; padding:10px 14px }
  .agent { align-self:flex-start; color:var(--fg) }
  .tool { align-self:flex-start; font:13px/1.5 "Geist Mono", ui-monospace, Menlo, monospace; color:var(--muted); display:flex; gap:8px; align-items:baseline }
  .tool b { color:var(--accent); font-weight:500 }
  .tool .ok { color:#34d399 }
  .tool .spin { display:inline-block; width:10px; color:var(--muted) }
  .think { color:var(--muted); font-size:13.5px }
  .think::after { content:''; display:inline-block; width:1.2em; text-align:left; animation:dots 1.2s steps(4) infinite }
  .code { margin:6px 0 0; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#0d1017; font:12.5px/1.6 "Geist Mono", ui-monospace, Menlo, monospace; color:#c7cbd6; white-space:pre }
  .code i { font-style:normal; color:#5eead4 } .code u { text-decoration:none; color:#a78bfa }
  footer { padding:16px 20px 20px }
  .box { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:12px 14px; min-height:52px; display:flex; align-items:center; gap:10px }
  #input { flex:1; white-space:pre-wrap }
  #input:empty::before { content:'Ask your agent…'; color:#5b6375 }
  .caret { width:2px; height:18px; background:var(--accent); animation:blink 1s steps(2) infinite }
  .send { width:30px; height:30px; border-radius:9px; background:#232a38; display:grid; place-items:center; color:var(--muted); transition:background .2s,color .2s }
  .send.on { background:var(--accent); color:#0b0d12 }
  @keyframes in { from { opacity:0; transform:translateY(6px) } }
  @keyframes blink { 50% { opacity:0 } }
  @keyframes dots { 0% { content:'' } 25% { content:'.' } 50% { content:'..' } 75% { content:'...' } }
</style>
</head>
<body>
<header><span class="logo"></span><b>Agent</b><span class="pill"><i></i>PixelLens connected</span></header>
<div id="log"></div>
<footer><div class="box"><span id="input"></span><span class="caret"></span><span class="send" id="send">↑</span></div></footer>
<script>
  const log = document.getElementById('log'), input = document.getElementById('input'), send = document.getElementById('send');
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const add = (cls, html) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; log.append(d); return d; };
  // driven by the recording script
  window.typeUser = async (text) => {
    for (const ch of text) { input.textContent += ch; send.classList.toggle('on', true); await wait(38 + Math.random() * 40); }
    await wait(350); add('user', input.textContent); input.textContent = ''; send.classList.remove('on');
  };
  window.think = () => add('think', 'Working');
  window.T = [];
  window.tool = (name, detail) => T.push(add('tool', `<span class="spin">⋯</span><span><b>pixellens</b> › ${name} <span style="color:#c7cbd6">${detail || ''}</span></span>`)) - 1;
  window.done = (i, note) => { const el = T[i]; el.querySelector('.spin').textContent = '✓'; el.querySelector('.spin').className = 'ok'; if (note) el.querySelector('span:last-child').insertAdjacentHTML('beforeend', ` <span style="color:#8b93a7">— ${note}</span>`); };
  window.say = (html) => { log.querySelectorAll('.think').forEach((t) => t.remove()); add('agent', html); };
  window.stop = () => log.querySelectorAll('.think').forEach((t) => t.remove());
</script>
</body>
</html>
